<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — Система заявок</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="./js/dashboard.js"></script>
</head>
<body class="min-h-screen bg-slate-100" data-role="user">
    <div id="toast-container" class="fixed inset-x-0 top-4 flex flex-col items-center space-y-3 z-50"></div>
    <header class="bg-white shadow">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div>
                <h1 class="text-xl font-semibold text-slate-800">Мои заявки</h1>
                <p class="text-sm text-slate-500">Создавайте заявки и отслеживайте статусы</p>
            </div>
            <div class="flex items-center space-x-4">
                <span id="userInfo" class="text-sm text-slate-600"></span>
                <button id="changePasswordBtn" class="hidden px-3 py-1 rounded-md border border-amber-400 text-amber-600 hover:bg-amber-50">Сменить пароль</button>
                <button id="logoutBtn" class="px-3 py-1 rounded-md bg-red-500 hover:bg-red-600 text-white">Выйти</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 space-y-8">
        <section id="passwordChangeSection" class="hidden bg-white shadow rounded-lg p-6 space-y-4">
            <h2 class="text-lg font-semibold text-slate-700">Смена пароля</h2>
            <form id="passwordChangeForm" class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-slate-600">Новый пароль</label>
                    <input type="password" name="new_password" required minlength="8" class="mt-1 block w-full rounded-md border-gray-300 focus:border-brand focus:ring-brand">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600">Подтверждение</label>
                    <input type="password" name="confirm_password" required minlength="8" class="mt-1 block w-full rounded-md border-gray-300 focus:border-brand focus:ring-brand">
                </div>
                <button type="submit" class="px-4 py-2 bg-brand text-white rounded-md hover:bg-brand-dark">Сохранить</button>
            </form>
        </section>

        <section class="bg-white shadow rounded-lg p-6 space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-semibold text-slate-700">Новая заявка</h2>
                <div class="space-x-2">
                    <button id="saveDraftBtn" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-md hover:bg-slate-300">Сохранить черновик</button>
                    <button id="submitRequestBtn" class="px-4 py-2 bg-brand text-white rounded-md hover:bg-brand-dark">Отправить</button>
                    <button id="downloadPdfBtn" class="px-4 py-2 bg-emerald-500 text-white rounded-md hover:bg-emerald-600 disabled:opacity-50 disabled:cursor-not-allowed" disabled>Скачать PDF</button>
                </div>
            </div>
            <form id="requestForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600">Обоснование <span class="text-red-500">*</span></label>
                    <textarea name="justification" id="justification" rows="4" required class="mt-1 w-full rounded-md border-gray-300 focus:border-brand focus:ring-brand" placeholder="Опишите необходимость закупки"></textarea>
                </div>
                <div>
                    <h3 class="text-md font-semibold text-slate-600 mb-2">Позиции</h3>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200" id="itemsTable">
                            <thead class="bg-slate-50">
                                <tr>
                                    <th class="px-3 py-2 text-left text-xs font-semibold text-slate-500">№</th>
                                    <th class="px-3 py-2 text-left text-xs font-semibold text-slate-500">Категория</th>
                                    <th class="px-3 py-2 text-left text-xs font-semibold text-slate-500">Наименование</th>
                                    <th class="px-3 py-2 text-left text-xs font-semibold text-slate-500">Ед. изм.</th>
                                    <th class="px-3 py-2 text-left text-xs font-semibold text-slate-500">Кол-во</th>
                                    <th class="px-3 py-2 text-left text-xs font-semibold text-slate-500">Комментарий</th>
                                    <th class="px-3 py-2 text-right text-xs font-semibold text-slate-500">Действия</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200" id="itemsBody"></tbody>
                        </table>
                    </div>
                    <button type="button" id="addItemBtn" class="mt-3 px-3 py-2 bg-slate-200 text-slate-700 rounded-md hover:bg-slate-300">Добавить позицию</button>
                </div>
            </form>
        </section>

        <section class="bg-white shadow rounded-lg p-6 space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-semibold text-slate-700">Мои заявки</h2>
                <div class="flex space-x-2">
                    <select id="filterStatus" class="rounded-md border-gray-300 text-sm">
                        <option value="">Все статусы</option>
                    </select>
                    <input type="date" id="filterFrom" class="rounded-md border-gray-300 text-sm">
                    <input type="date" id="filterTo" class="rounded-md border-gray-300 text-sm">
                    <button id="applyFiltersBtn" class="px-3 py-2 bg-slate-200 rounded-md text-sm">Применить</button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200" id="requestsTable">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="px-3 py-2 text-left text-xs font-semibold text-slate-500">№</th>
                            <th class="px-3 py-2 text-left text-xs font-semibold text-slate-500">Дата</th>
                            <th class="px-3 py-2 text-left text-xs font-semibold text-slate-500">Статус</th>
                            <th class="px-3 py-2 text-left text-xs font-semibold text-slate-500">Позиций</th>
                            <th class="px-3 py-2 text-left text-xs font-semibold text-slate-500">Обоснование</th>
                            <th class="px-3 py-2 text-right text-xs font-semibold text-slate-500">Действия</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200" id="requestsBody"></tbody>
                </table>
            </div>
            <div class="flex justify-between items-center text-sm text-slate-500">
                <span id="requestsSummary"></span>
                <div class="space-x-2">
                    <button id="prevPageBtn" class="px-2 py-1 bg-slate-200 rounded disabled:opacity-50">Назад</button>
                    <button id="nextPageBtn" class="px-2 py-1 bg-slate-200 rounded disabled:opacity-50">Вперёд</button>
                </div>
            </div>
        </section>
    </main>

    <template id="itemRowTemplate">
        <tr>
            <td class="px-3 py-2 text-sm text-slate-600 index">1</td>
            <td class="px-3 py-2 text-sm"><input name="category" required class="w-full rounded border-gray-300"></td>
            <td class="px-3 py-2 text-sm"><input name="item_name" required class="w-full rounded border-gray-300"></td>
            <td class="px-3 py-2 text-sm"><input name="unit" required class="w-full rounded border-gray-300"></td>
            <td class="px-3 py-2 text-sm"><input name="qty" type="number" min="0.01" step="0.01" required class="w-full rounded border-gray-300"></td>
            <td class="px-3 py-2 text-sm"><input name="note" class="w-full rounded border-gray-300"></td>
            <td class="px-3 py-2 text-right text-sm"><button type="button" class="removeItem text-red-500 hover:text-red-700">Удалить</button></td>
        </tr>
    </template>

    <script type="module">
        import { initDashboard } from './js/dashboard.js';
        initDashboard();
    </script>
</body>
</html>
